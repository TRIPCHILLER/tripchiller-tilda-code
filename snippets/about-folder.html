<!-- TRIPCHILLER / ABOUT / desktop folder prototype. Insert only on ABOUT. -->
<section id="tc-contact-folder" aria-label="Контакты — папка с брифом" data-asset-base="https://cdn.jsdelivr.net/gh/TRIPCHILLER/tripchiller-tilda-code@41a66d412238560dbfa309be20e238a34099ee26/assets/about-folder/">
  <div class="tc-folder-stage">
    <img class="tc-folder-base tc-folder-left" data-asset="open" alt="" draggable="false">
    <img class="tc-folder-base tc-folder-right" data-asset="open" alt="" draggable="false">
    <div class="tc-folder-paper-stack">
      <article class="tc-folder-sheet" aria-label="Тестовый лист 1" aria-hidden="false"><span class="tc-folder-page-number">01 / 03</span></article>
      <article class="tc-folder-sheet" aria-label="Тестовый лист 2" aria-hidden="true"><span class="tc-folder-page-number">02 / 03</span></article>
      <article class="tc-folder-sheet" aria-label="Тестовый лист 3" aria-hidden="true"><span class="tc-folder-page-number">03 / 03</span></article>
    </div>
    <div class="tc-folder-tabs" role="group" aria-label="Листы брифа">
      <button class="tc-folder-tab" type="button" aria-label="Открыть лист 1" aria-pressed="true" disabled><img data-asset="tab1" alt=""><span>01</span></button>
      <button class="tc-folder-tab" type="button" aria-label="Открыть лист 2" aria-pressed="false" disabled><img data-asset="tab2" alt=""><span>02</span></button>
      <button class="tc-folder-tab" type="button" aria-label="Открыть лист 3" aria-pressed="false" disabled><img data-asset="tab3" alt=""><span>03</span></button>
    </div>
    <div class="tc-folder-clip"><img data-asset="clip" alt="Металлический зажим поверх листа" draggable="false"></div>
    <div class="tc-folder-cover"><div class="tc-folder-cover-front"><img data-asset="unlatched" alt="Обложка папки" draggable="false"></div><div class="tc-folder-cover-back"><img data-asset="open" alt="" draggable="false"></div></div>
    <div class="tc-folder-latch"><img data-asset="closed" alt="" draggable="false"></div>
  </div>
  <div class="tc-folder-controls"><button class="tc-folder-replay" type="button" disabled>Повторить раскрытие</button><span class="tc-folder-status" role="status" aria-live="polite">Загрузка папки…</span></div>
</section>
