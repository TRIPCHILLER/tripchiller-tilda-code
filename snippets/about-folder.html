<!-- TRIPCHILLER / ABOUT / desktop folder prototype. Insert only on ABOUT. -->
<section id="tc-contact-folder" aria-label="Контакты — папка с брифом" data-asset-base="https://cdn.jsdelivr.net/gh/TRIPCHILLER/tripchiller-tilda-code@cd5ec566219e55aee82c7c55be9aa53ae87526bf/assets/about-folder/" data-state="closed">
  <div class="tc-folder-stage">
    <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="tc-folder-contact-shadow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".48"/></feComponentTransfer><feComposite in2="SourceAlpha" operator="out"/></filter></defs></svg>
    <div class="tc-folder-open-shadow"><img data-asset="open" alt="" draggable="false"></div>
    <img class="tc-folder-base" data-asset="open" alt="" draggable="false">
    <div class="tc-folder-closed-shadow"><img data-asset="cover" alt=""></div>
    <div class="tc-folder-paper-stack" role="group" aria-label="Стопка из трёх листов брифа">
      <article class="tc-folder-sheet" data-page="1" aria-label="Лист 1">
        <div class="tc-folder-paper-face"><span class="tc-folder-page-number">01 / 03</span></div>
        <button class="tc-folder-tab" type="button" aria-label="Открыть лист 1" aria-pressed="true" disabled><img data-asset="tab1" alt=""><span class="tc-folder-tab-label">01</span><span class="tc-folder-tab-tip" aria-hidden="true"></span></button>
      </article>
      <article class="tc-folder-sheet" data-page="2" aria-label="Лист 2">
        <div class="tc-folder-paper-face" aria-hidden="true"><span class="tc-folder-page-number">02 / 03</span></div>
        <button class="tc-folder-tab" type="button" aria-label="Открыть лист 2" aria-pressed="false" disabled><img data-asset="tab2" alt=""><span class="tc-folder-tab-label">02</span><span class="tc-folder-tab-tip" aria-hidden="true"></span></button>
      </article>
      <article class="tc-folder-sheet" data-page="3" aria-label="Лист 3">
        <div class="tc-folder-paper-face" aria-hidden="true"><span class="tc-folder-page-number">03 / 03</span></div>
        <button class="tc-folder-tab" type="button" aria-label="Открыть лист 3" aria-pressed="false" disabled><img data-asset="tab3" alt=""><span class="tc-folder-tab-label">03</span><span class="tc-folder-tab-tip" aria-hidden="true"></span></button>
      </article>
    </div>
    <div class="tc-folder-clip" aria-label="Зажим для бумаги"><img class="tc-folder-clip-closed" data-asset="clip-closed" alt=""><img class="tc-folder-clip-open" data-asset="clip-open" alt=""></div>
    <div class="tc-folder-cover"><div class="tc-folder-cover-front"><img data-asset="cover" alt="Обложка папки" draggable="false"></div><div class="tc-folder-cover-back"><div class="tc-folder-cover-back-crop"><img data-asset="open" alt="" draggable="false"></div></div></div>
    <img class="tc-folder-latch-closed" data-asset="latch-closed" alt="" draggable="false">
    <img class="tc-folder-latch-open" data-asset="latch-open" alt="" draggable="false">
  </div>
  <div class="tc-folder-controls"><button class="tc-folder-replay" type="button" disabled>Повторить раскрытие</button><span class="tc-folder-status" role="status" aria-live="polite">Загрузка папки…</span></div>
</section>
